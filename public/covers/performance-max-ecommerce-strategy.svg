<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800;900&amp;family=Inter:wght@400;600;700;800&amp;display=swap');
      text { font-family: 'DM Sans', 'Inter', -apple-system, sans-serif; }
    </style>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121211" />
      <stop offset="100%" stop-color="#0B0B0A" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />
  <rect width="1200" height="675" fill="url(#grid)" />

  <!-- Accent Edge Glow -->
  <circle cx="1100" cy="80" r="320" fill="#ED463B" opacity="0.08" />
  <circle cx="100" cy="600" r="280" fill="#10B981" opacity="0.06" />

  <!-- LEFT COLUMN: Brand, Category, Title & Author Metadata -->
  <g transform="translate(70, 75)">
    <!-- Brand Monogram & Label -->
    <g>
      <rect width="36" height="36" rx="10" fill="#191919" />
      <text x="18" y="24" fill="#FFFFFF" font-size="16" font-weight="900" text-anchor="middle">V</text>
      <text x="48" y="23" fill="#F5F2EC" font-size="14" font-weight="800" letter-spacing="-0.3">VedantVerse</text>
      <text x="145" y="23" fill="#8C887F" font-size="12" font-weight="500">· Growth Studio</text>
    </g>

    <!-- Category Pill -->
    <g transform="translate(0, 70)">
      <rect width="237" height="26" rx="13" fill="#1C1B19" stroke="#ED463B" stroke-width="1.2" />
      <circle cx="14" cy="13" r="3.5" fill="#ED463B" />
      <text x="24" y="17" fill="#ED463B" font-family="monospace" font-size="10.5" font-weight="800" letter-spacing="1">GOOGLE ADS &amp; SEARCH</text>
    </g>

    <!-- Main Editorial Title -->
    <g transform="translate(0, 150)">
      
        <text x="0" y="0" fill="#F5F2EC" font-size="34" font-weight="800" letter-spacing="-0.8">
          Performance Max for E-commerce:
        </text>
      
        <text x="0" y="48" fill="#F5F2EC" font-size="34" font-weight="800" letter-spacing="-0.8">
          Strategy, Setup and Optimization
        </text>
      
    </g>

    <!-- Subtitle / Meta Description Gist -->
    <g transform="translate(0, 261)">
      <text x="0" y="0" fill="#8C887F" font-size="15" font-weight="500" letter-spacing="-0.2">
        Authoritative media planning architecture &amp; empirical conversion benchmarks.
      </text>
    </g>

    <!-- Author & Reading Metadata Box -->
    <g transform="translate(0, 445)">
      <line x1="0" y1="0" x2="520" y2="0" stroke="#2A2927" stroke-width="1" />
      
      <!-- Author Pill -->
      <g transform="translate(0, 20)">
        <circle cx="18" cy="18" r="18" fill="#2A2927" />
        <text x="18" y="23" fill="#F5F2EC" font-size="12" font-weight="800" text-anchor="middle">VT</text>
        
        <text x="46" y="15" fill="#F5F2EC" font-size="13" font-weight="700">Vedant Tiwari</text>
        <text x="46" y="29" fill="#8C887F" font-size="11" font-weight="500">Senior Performance Marketing Executive</text>

        <!-- Right Side Badge -->
        <rect x="400" y="6" width="115" height="24" rx="6" fill="#1A1918" stroke="#2A2927" />
        <text x="457" y="22" fill="#8C887F" font-family="monospace" font-size="10.5" font-weight="700" text-anchor="middle">16:9 HD HERO</text>
      </g>
    </g>
  </g>

  <!-- RIGHT COLUMN: Technical Archetype Schematic -->
  
      <g transform="translate(680, 110)">
        <rect width="470" height="455" rx="20" fill="#1A1918" stroke="#2A2927" stroke-width="1.5" />
        <rect x="0" y="0" width="470" height="48" rx="20" fill="#232220" />
        <circle cx="28" cy="24" r="5" fill="#ED463B" />
        <circle cx="44" cy="24" r="5" fill="#EAB308" />
        <circle cx="60" cy="24" r="5" fill="#10B981" />
        <text x="80" y="29" fill="#8C887F" font-family="monospace" font-size="11" font-weight="700" letter-spacing="1">GOOGLE PERFORMANCE MAX ARCHITECTURE</text>
        
        <!-- Asset Groups Breakdown -->
        <g transform="translate(30, 75)">
          <rect x="0" y="0" width="410" height="110" rx="12" fill="#141413" stroke="#2A2927" />
          <text x="18" y="26" fill="#F5F2EC" font-family="sans-serif" font-size="12" font-weight="700">Asset Group Value Segmentation</text>
          
          <g transform="translate(18, 44)">
            <rect x="0" y="0" width="115" height="50" rx="6" fill="#1E1D1B" stroke="#2A2927" />
            <text x="12" y="18" fill="#8C887F" font-family="monospace" font-size="8" font-weight="700">GROUP 1 (HERO)</text>
            <text x="12" y="36" fill="#F5F2EC" font-family="sans-serif" font-size="12" font-weight="800">High Margin</text>

            <rect x="128" y="0" width="115" height="50" rx="6" fill="#1E1D1B" stroke="#2A2927" />
            <text x="140" y="18" fill="#8C887F" font-family="monospace" font-size="8" font-weight="700">GROUP 2</text>
            <text x="140" y="36" fill="#F5F2EC" font-family="sans-serif" font-size="12" font-weight="800">New Arrivals</text>

            <rect x="256" y="0" width="115" height="50" rx="6" fill="#1E1D1B" stroke="#10B981" />
            <text x="268" y="18" fill="#10B981" font-family="monospace" font-size="8" font-weight="700">ROAS TARGET</text>
            <text x="268" y="36" fill="#10B981" font-family="sans-serif" font-size="12" font-weight="800">620% tROAS</text>
          </g>
        </g>

        <!-- Search Intent & Exclusion Rules -->
        <g transform="translate(30, 210)">
          <rect x="0" y="0" width="410" height="150" rx="12" fill="#141413" stroke="#2A2927" />
          <text x="18" y="28" fill="#F5F2EC" font-family="sans-serif" font-size="12" font-weight="700">Conversion Value Rules &amp; Negative Filtering</text>
          
          <g transform="translate(18, 48)">
            <rect x="0" y="0" width="374" height="34" rx="6" fill="#1E1D1B" />
            <text x="14" y="22" fill="#ED463B" font-family="monospace" font-size="10" font-weight="700">RULE A:</text>
            <text x="70" y="22" fill="#F5F2EC" font-family="monospace" font-size="10">Brand Cannibalization Exclusions (Active)</text>

            <rect x="0" y="44" width="374" height="34" rx="6" fill="#1E1D1B" />
            <text x="14" y="66" fill="#10B981" font-family="monospace" font-size="10" font-weight="700">RULE B:</text>
            <text x="70" y="66" fill="#F5F2EC" font-family="monospace" font-size="10">High-LTV Geo Lift Multiplier (+25%)</text>
          </g>
        </g>

        <!-- Bottom Tag -->
        <g transform="translate(30, 395)">
          <text x="0" y="18" fill="#8C887F" font-family="monospace" font-size="10">Google Ads API v18 · Smart Bidding Architecture Verified</text>
        </g>
      </g>
    
</svg>
