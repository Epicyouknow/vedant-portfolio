          <text x="20" y="28" fill="#F5F2EC" font-family="sans-serif" font-size="12" font-weight="700">Lead Verification &amp; Show-Up Rate</text>
          
          <g transform="translate(20, 48)">
            <text x="0" y="0" fill="#8C887F" font-family="monospace" font-size="10">Two-Step OTP Phone Verification Quality</text>
            <text x="370" y="0" fill="#10B981" font-family="monospace" font-size="10" font-weight="700" text-anchor="end">96.2% Genuine</text>
            <rect x="0" y="8" width="370" height="6" rx="3" fill="#2A2927" />
            <rect x="0" y="8" width="355" height="6" rx="3" fill="#10B981" />

            <text x="0" y="36" fill="#8C887F" font-family="monospace" font-size="10">On-Site Experience Center Show-Up Ratio</text>
            <text x="370" y="36" fill="#ED463B" font-family="monospace" font-size="10" font-weight="700" text-anchor="end">78.4% Verified</text>
            <rect x="0" y="44" width="370" height="6" rx="3" fill="#2A2927" />
            <rect x="0" y="44" width="310" height="6" rx="3" fill="#ED463B" />
          </g>
