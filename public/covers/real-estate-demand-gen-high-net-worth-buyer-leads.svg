            <text x="14" y="46" fill="#F5F2EC" font-family="sans-serif" font-size="12" font-weight="700">Micro Video</text>
            <text x="14" y="66" fill="#10B981" font-family="monospace" font-size="10">High Visual</text>

            <rect x="142" y="0" width="125" height="90" rx="10" fill="#141413" stroke="#ED463B" stroke-width="1.5" />
            <text x="156" y="24" fill="#ED463B" font-family="monospace" font-size="9" font-weight="700">SITE VISIT CPL</text>
            <text x="156" y="46" fill="#F5F2EC" font-family="sans-serif" font-size="12" font-weight="700">₹1,850 CPL</text>
            <text x="156" y="66" fill="#10B981" font-family="monospace" font-size="10" font-weight="700">-46% vs Portal</text>

            <rect x="284" y="0" width="125" height="90" rx="10" fill="#141413" stroke="#2A2927" />
            <text x="298" y="24" fill="#8C887F" font-family="monospace" font-size="9" font-weight="700">HNW INTENT</text>
            <text x="298" y="46" fill="#F5F2EC" font-family="sans-serif" font-size="12" font-weight="700">Top 5% Pincodes</text>
            <text x="298" y="66" fill="#10B981" font-family="monospace" font-size="10">Filtered</text>
          </g>
